name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Native Build Dependencies (for better-sqlite3)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck & Build Backend
        working-directory: ./backend
        run: npm run build

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Code
        working-directory: ./frontend
        run: npm run lint

      - name: Build Production SPA
        working-directory: ./frontend
        run: npm run build
